# LLM Gate 工作空间终端的 tmux 设置。守护进程每次 attach 都把这份文件 source 进主机上的
# tmux 服务器，让浏览器里的 xterm.js 终端有正常的鼠标行为；它在 ~/.tmux.conf 之后生效。
# tmux 的这些选项与按键表都是整台服务器共用的，同一用户从 SSH 打开的会话也会带上。
#
# 鼠标：滚轮翻看历史（进入复制模式，滚到底自动退出）；拖选即复制，选区保留高亮；单击退出
# 复制模式；右键不弹 tmux 菜单，留给浏览器自己的复制 / 粘贴菜单。要用浏览器原生选区，按住
# Shift 拖选（macOS 为 Option）。

set -g mouse on
set -g history-limit 10000
# 复制模式的选区经 OSC 52 交给外层终端的剪贴板（浏览器终端由 xterm.js 的 clipboard addon 接收）
set -s set-clipboard on
setw -g mode-keys vi
set -s escape-time 10
set -g focus-events on

# 右键：不弹 tmux 菜单（缺省菜单里有分屏、结束 pane 等动作，误点即生效）
unbind -n MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n MouseDown3StatusRight
unbind -n M-MouseDown3Pane
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3StatusLeft

# 拖选结束：复制到 tmux 缓冲区与剪贴板，选区保留高亮；单击取消并回到正常模式
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseUp1Pane send-keys -X cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode MouseUp1Pane send-keys -X cancel
